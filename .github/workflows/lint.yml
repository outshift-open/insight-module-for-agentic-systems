---
name: lint

on:
  push:
    # Run typecheck and lint on pushes to default branch
    branches:
      - main
  # Run typecheck and lint on pull request events
  pull_request:

# Declare default permissions as read-only
permissions: read-all

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: observability-plugin
    steps:
      - name: 🔒 harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: observability-plugin/package-lock.json
      - name: 📦 install dependencies
        run: npm ci
      - name: 🔍 typecheck
        run: npm run typecheck
      - name: 🧹 lint
        run: npm run lint
