---
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write  # Required for OIDC trusted publishing
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: observability-plugin

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run ci-test

      - name: Build
        run: npm run build

      - name: Package artifact
        run: npm run package:artifact

      - name: Create archive
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE="insight-module-${VERSION}.zip"
          cd artifact
          zip -r "../${ARCHIVE}" package/
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Publish to npm
        run: npm publish --access public
        working-directory: observability-plugin/artifact/package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "insight-module ${{ env.VERSION }}"
          generate_release_notes: true
          files: observability-plugin/${{ env.ARCHIVE }}
